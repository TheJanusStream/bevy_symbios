[package]
name = "bevy_symbios"
version = "0.8.1"
edition = "2024"
authors = ["Janus"]
description = "Bevy integration for the Symbios L-System ecosystem."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/bevy_symbios"
keywords = ["lsystem", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

[features]
default = []
physics = ["dep:avian3d"]
egui = ["dep:bevy_egui", "bevy_symbios_texture/egui"]
robot = ["dep:symbios-robot", "physics"]
asset-loader = ["dep:serde_json"]

[dependencies]
bevy = "0.19"
symbios = "1.5"
symbios-turtle-3d = "0.6"
symbios-robot = { version = "0.4", optional = true }
bevy_egui = { version = "0.41", optional = true }
bevy_symbios_texture = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[dependencies.avian3d]
version = "0.7"
optional = true

[dev-dependencies]
glam = "0.32"
avian3d = "0.7"
serde_json = "1.0"

# `hot_reload` consumes `bevy_symbios::loader::*`, which is feature-gated
# behind `asset-loader`. Marking it `required-features` makes cargo skip the
# example when that feature is off (rather than failing to resolve the import).
[[example]]
name = "hot_reload"
required-features = ["asset-loader"]
