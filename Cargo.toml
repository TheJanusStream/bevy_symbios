[package]
name = "bevy_symbios"
version = "0.3.0"
edition = "2024"
authors = ["Janus"]
description = "Bevy integration for the Symbios L-System ecosystem."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/bevy_symbios"
keywords = ["lsystem", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

[features]
default = []
physics = ["dep:avian3d"]
egui = ["dep:bevy_egui", "bevy_symbios_texture/egui"]
robot = ["dep:symbios-robot", "physics"]

[dependencies]
bevy = "0.18"
symbios = "1.4"
symbios-turtle-3d = "0.4"
symbios-robot = { version = "0.1", optional = true }
bevy_egui = { version = "0.39", optional = true }
bevy_symbios_texture = "0.3"
serde = { version = "1.0", features = ["derive"] }

[dependencies.avian3d]
version = "0.6"
optional = true

[dev-dependencies]
glam = "0.30.10"
avian3d = "0.6"
